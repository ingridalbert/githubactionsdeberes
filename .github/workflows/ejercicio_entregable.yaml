name: Pipeline de Datos Seguro

on:
  workflow_dispatch:
    inputs:
      tests_seguridad:
        description: "¿Ejecutar los Tests de Seguridad?"
        required: true
        type: choice
        options:
          - "si"
          - "no"
        default: "si"

jobs:
  ci-seguridad:
    name: CI & Seguridad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar que ventas.json es un JSON válido
        run: |
          python -m json.tool ventas.json > /dev/null
          echo "✅ ventas.json es un JSON válido"
      
      - name: Escaneo de seguridad (claves API expuestas)
        if: ${{ inputs.tests_seguridad == 'si' }}
        run: python scripts/security_scan.py